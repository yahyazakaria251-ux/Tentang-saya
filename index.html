<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Profil Yahya Zakaria</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 600px;
      margin: 50px auto;
      background: white;
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    h1, h2 {
      text-align: center;
    }
    .profile p {
      font-size: 16px;
      color: #333;
    }
    textarea {
      width: 100%;
      height: 70px;
      padding: 10px;
      margin-top: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      resize: none;
    }
    button {
      margin-top: 10px;
      padding: 8px 15px;
      border: none;
      border-radius: 8px;
      background: #667eea;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background: #5563c1;
    }
    .message {
      background: #f3f3f3;
      padding: 10px;
      margin-top: 10px;
      border-radius: 8px;
    }
    .actions button {
      margin-right: 5px;
      background: #ff9800;
    }
    .actions .delete {
      background: #e53935;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Tentang Saya</h1>
    <div class="profile">
      <p><strong>Nama:</strong> Yahya Zakaria</p>
      <p><strong>Sekolah:</strong> SMP Negeri 1 Sukoharjo</p>
      <p><strong>Kelas:</strong> IXA</p>
      <p><strong>Minat:</strong> Teknologi & Pemrograman</p>
    </div>

    <hr>

    <h2>Pesan / Catatan</h2>
    <textarea id="pesan" placeholder="Tulis pesan di sini..."></textarea>
    <button onclick="tambahPesan()">Simpan Pesan</button>

    <div id="daftarPesan"></div>
  </div>

  <script>
    let editIndex = null;

    function ambilPesan() {
      return JSON.parse(localStorage.getItem("pesanYahya")) || [];
    }

    function simpanPesan(data) {
      localStorage.setItem("pesanYahya", JSON.stringify(data));
    }

    function tampilPesan() {
      const daftar = document.getElementById("daftarPesan");
      daftar.innerHTML = "";
      const data = ambilPesan();

      data.forEach((item, index) => {
        daftar.innerHTML += `
          <div class="message">
            <p>${item}</p>
            <div class="actions">
              <button onclick="editPesan(${index})">Edit</button>
              <button class="delete" onclick="hapusPesan(${index})">Hapus</button>
            </div>
          </div>
        `;
      });
    }

    function tambahPesan() {
      const textarea = document.getElementById("pesan");
      const teks = textarea.value.trim();
      if (teks === "") return alert("Pesan tidak boleh kosong!");

      const data = ambilPesan();

      if (editIndex !== null) {
        data[editIndex] = teks;
        editIndex = null;
      } else {
        data.push(teks);
      }

      simpanPesan(data);
      textarea.value = "";
      tampilPesan();
    }

    function editPesan(index) {
      const data = ambilPesan();
      document.getElementById("pesan").value = data[index];
      editIndex = index;
    }

    function hapusPesan(index) {
      const data = ambilPesan();
      data.splice(index, 1);
      simpanPesan(data);
      tampilPesan();
    }

    tampilPesan();
  </script>

</body>
</html>
