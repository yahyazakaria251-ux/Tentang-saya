<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Profil Editable - Yahya Zakaria</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 700px;
      margin: 40px auto;
      background: #fff;
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 15px 30px rgba(0,0,0,0.2);
    }

    h1, h2 {
      text-align: center;
    }

    /* FOTO */
    .foto {
      text-align: center;
      margin-bottom: 20px;
    }

    .foto img {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #667eea;
      display: none;
    }

    /* PROFIL */
    .profil label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }

    .profil input {
      width: 100%;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #ccc;
      margin-top: 5px;
    }

    button {
      margin-top: 12px;
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      background: #667eea;
      color: white;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    /* PESAN */
    textarea {
      width: 100%;
      height: 80px;
      margin-top: 10px;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      resize: none;
    }

    .pesan {
      background: #f3f4f6;
      padding: 10px;
      border-radius: 8px;
      margin-top: 10px;
    }

    .aksi button {
      background: #ff9800;
      margin-right: 5px;
    }

    .aksi .hapus {
      background: #e53935;
    }

    hr {
      margin: 25px 0;
    }
  </style>
</head>
<body>

<div class="container">

  <h1>Profil Saya</h1>

  <!-- FOTO PROFIL -->
  <div class="foto">
    <img id="fotoProfil">
    <br>
    <input type="file" id="uploadFoto" accept="image/*">
    <br>
    <button onclick="hapusFoto()">Hapus Foto</button>
  </div>

  <!-- PROFIL EDIT -->
  <h2>Data Diri</h2>
  <div class="profil">
    <label>Nama</label>
    <input type="text" id="nama">

    <label>Sekolah</label>
    <input type="text" id="sekolah">

    <label>Kelas</label>
    <input type="text" id="kelas">

    <label>Minat</label>
    <input type="text" id="minat">

    <button onclick="simpanProfil()">Simpan Profil</button>
  </div>

  <hr>

  <!-- PESAN -->
  <h2>Pesan / Catatan</h2>
  <textarea id="inputPesan" placeholder="Tulis pesan di sini..."></textarea>
  <button onclick="simpanPesan()">Simpan Pesan</button>

  <div id="listPesan"></div>

</div>

<script>
/* ===== PROFIL ===== */
const profilDefault = {
  nama: "Yahya Zakaria",
  sekolah: "SMP Negeri 1 Sukoharjo",
  kelas: "IXA",
  minat: "Teknologi & Pemrograman"
};

function loadProfil() {
  const data = JSON.parse(localStorage.getItem("profilYahya")) || profilDefault;
  document.getElementById("nama").value = data.nama;
  document.getElementById("sekolah").value = data.sekolah;
  document.getElementById("kelas").value = data.kelas;
  document.getElementById("minat").value = data.minat;
}

function simpanProfil() {
  const data = {
    nama: nama.value,
    sekolah: sekolah.value,
    kelas: kelas.value,
    minat: minat.value
  };
  localStorage.setItem("profilYahya", JSON.stringify(data));
  alert("Profil berhasil disimpan!");
}

loadProfil();

/* ===== FOTO ===== */
const fotoProfil = document.getElementById("fotoProfil");
const uploadFoto = document.getElementById("uploadFoto");

const fotoSimpan = localStorage.getItem("fotoProfilYahya");
if (fotoSimpan) {
  fotoProfil.src = fotoSimpan;
  fotoProfil.style.display = "inline-block";
}

uploadFoto.addEventListener("change", function () {
  const file = uploadFoto.files[0];
  if (!file) return;

  if (file.size > 1024 * 1024) {
    alert("Ukuran foto maksimal 1MB");
    return;
  }

  const reader = new FileReader();
  reader.onload = e => {
    localStorage.setItem("fotoProfilYahya", e.target.result);
    fotoProfil.src = e.target.result;
    fotoProfil.style.display = "inline-block";
  };
  reader.readAsDataURL(file);
});

function hapusFoto() {
  localStorage.removeItem("fotoProfilYahya");
  fotoProfil.style.display = "none";
}

/* ===== PESAN ===== */
let editIndex = null;

function ambilPesan() {
  return JSON.parse(localStorage.getItem("pesanYahya")) || [];
}

function simpanDataPesan(data) {
  localStorage.setItem("pesanYahya", JSON.stringify(data));
}

function tampilPesan() {
  const list = document.getElementById("listPesan");
  list.innerHTML = "";
  ambilPesan().forEach((p, i) => {
    list.innerHTML += `
      <div class="pesan">
        <p>${p}</p>
        <div class="aksi">
          <button onclick="editPesan(${i})">Edit</button>
          <button class="hapus" onclick="hapusPesan(${i})">Hapus</button>
        </div>
      </div>`;
  });
}

function simpanPesan() {
  const teks = inputPesan.value.trim();
  if (!teks) return alert("Pesan kosong!");

  const data = ambilPesan();
  if (editIndex !== null) {
    data[editIndex] = teks;
    editIndex = null;
  } else {
    data.push(teks);
  }

  simpanDataPesan(data);
  inputPesan.value = "";
  tampilPesan();
}

function editPesan(i) {
  inputPesan.value = ambilPesan()[i];
  editIndex = i;
}

function hapusPesan(i) {
  const data = ambilPesan();
  data.splice(i, 1);
  simpanDataPesan(data);
  tampilPesan();
}

tampilPesan();
</script>

</body>
</html>
